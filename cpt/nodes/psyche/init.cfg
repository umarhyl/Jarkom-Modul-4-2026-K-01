enable
configure terminal
hostname Psyche
no ip domain-lookup
!
interface FastEthernet0/0
 description Segmen-Switch2-A3
 ip address 10.64.0.138 255.255.255.248
 no shutdown
!
interface FastEthernet0/1
 description LAN-Switch3-A6
 ip address 10.64.4.1 255.255.252.0
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.4.1
ip dhcp pool LAN-A6
 network 10.64.4.0 255.255.252.0
 default-router 10.64.4.1
 dns-server 8.8.8.8
!
router ospf 1
 router-id 3.3.3.3
 passive-interface FastEthernet0/1
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory