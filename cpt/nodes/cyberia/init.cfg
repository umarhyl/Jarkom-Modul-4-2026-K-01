enable
configure terminal
hostname Cyberia
no ip domain-lookup
!
interface FastEthernet0/0
 description Uplink-NAT-Cloud
 ip address dhcp
 ip nat outside
 no shutdown
!
interface FastEthernet0/1
 description LAN-Switch1-A1
 ip address 10.64.0.1 255.255.255.128
 ip nat inside
 no shutdown
!
interface FastEthernet1/0
 description Link-ke-Wired-A2
 ip address 10.64.0.129 255.255.255.252
 ip nat inside
 no shutdown
!
! ---- NAT overload (PAT) ke Cloud ----
access-list 1 permit 10.64.0.0 0.0.255.255
ip nat inside source list 1 interface FastEthernet0/0 overload
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.0.1
ip dhcp pool LAN-A1
 network 10.64.0.0 255.255.255.128
 default-router 10.64.0.1
 dns-server 8.8.8.8
!
router ospf 1
 router-id 1.1.1.1
 passive-interface FastEthernet0/1
 network 10.64.0.0 0.0.255.255 area 0
 default-information originate
!
ip route 0.0.0.0 0.0.0.0 FastEthernet0/0
end
write memory