enable
configure terminal
hostname Phantoma
no ip domain-lookup
!
interface FastEthernet1/0
 description Link-ke-Knights-A22
 ip address 10.64.23.138 255.255.255.252
 no shutdown
!
interface FastEthernet0/0
 description LAN-Switch12-A23
 ip address 10.64.23.145 255.255.255.240
 no shutdown
!
interface FastEthernet0/1
 description Link-ke-Shibuya-A24
 ip address 10.64.23.161 255.255.255.252
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.23.145
ip dhcp pool LAN-A23
 network 10.64.23.144 255.255.255.240
 default-router 10.64.23.145
 dns-server 8.8.8.8
!
router ospf 1
 router-id 12.12.12.12
 passive-interface FastEthernet0/0
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory