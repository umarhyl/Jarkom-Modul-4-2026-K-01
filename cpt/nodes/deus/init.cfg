enable
configure terminal
hostname Deus
no ip domain-lookup
!
interface FastEthernet0/1
 description Link-ke-Tachibana-A16
 ip address 10.64.22.2 255.255.255.252
 no shutdown
!
interface FastEthernet0/0
 description LAN-Switch10-A17
 ip address 10.64.22.129 255.255.255.128
 no shutdown
!
interface FastEthernet1/0
 description Link-ke-Protocol7-A18
 ip address 10.64.23.1 255.255.255.252
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.22.129
ip dhcp pool LAN-A17
 network 10.64.22.128 255.255.255.128
 default-router 10.64.22.129
 dns-server 8.8.8.8
!
router ospf 1
 router-id 9.9.9.9
 passive-interface FastEthernet0/0
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory