enable
configure terminal
hostname Navi
no ip domain-lookup
!
interface Ethernet1/0
 description Link-ke-Wired-A4
 ip address 10.64.0.146 255.255.255.252
 no shutdown
!
interface FastEthernet0/0
 description LAN-Switch6-A12
 ip address 10.64.16.1 255.255.255.0
 no shutdown
!
interface FastEthernet0/1
 description LAN-Switch7-A13
 ip address 10.64.17.1 255.255.255.192
 no shutdown
!
interface Ethernet1/1
 description LAN-Switch8-A14
 ip address 10.64.18.1 255.255.255.0
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.16.1
ip dhcp excluded-address 10.64.17.1
ip dhcp excluded-address 10.64.18.1
ip dhcp pool LAN-A12
 network 10.64.16.0 255.255.255.0
 default-router 10.64.16.1
 dns-server 8.8.8.8
ip dhcp pool LAN-A13
 network 10.64.17.0 255.255.255.192
 default-router 10.64.17.1
 dns-server 8.8.8.8
ip dhcp pool LAN-A14
 network 10.64.18.0 255.255.255.0
 default-router 10.64.18.1
 dns-server 8.8.8.8
!
router ospf 1
 router-id 7.7.7.7
 passive-interface FastEthernet0/0
 passive-interface FastEthernet0/1
 passive-interface FastEthernet3/1
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory