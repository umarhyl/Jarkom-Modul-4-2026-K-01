enable
configure terminal
hostname Shibuya
no ip domain-lookup
!
interface FastEthernet0/1
 description Link-ke-Phantoma-A24
 ip address 10.64.23.162 255.255.255.252
 no shutdown
!
interface FastEthernet0/0
 description LAN-Switch13-A25
 ip address 10.64.23.193 255.255.255.192
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.23.193
ip dhcp pool LAN-A25
 network 10.64.23.192 255.255.255.192
 default-router 10.64.23.193
 dns-server 8.8.8.8
!
router ospf 1
 router-id 13.13.13.13
 passive-interface FastEthernet0/0
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory