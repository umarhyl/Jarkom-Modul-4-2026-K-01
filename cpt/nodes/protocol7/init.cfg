enable
configure terminal
hostname Protocol7
no ip domain-lookup
!
interface FastEthernet1/0
 description Link-ke-Deus-A18
 ip address 10.64.23.2 255.255.255.252
 no shutdown
!
interface FastEthernet0/0
 description LAN-Switch11-A19
 ip address 10.64.23.65 255.255.255.192
 no shutdown
!
interface FastEthernet0/1
 description Link-ke-Knights-A20
 ip address 10.64.23.129 255.255.255.252
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.23.65
ip dhcp pool LAN-A19
 network 10.64.23.64 255.255.255.192
 default-router 10.64.23.65
 dns-server 8.8.8.8
!
router ospf 1
 router-id 10.10.10.10
 passive-interface FastEthernet0/0
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory
