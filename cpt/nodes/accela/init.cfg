enable
configure terminal
hostname Accela
no ip domain-lookup
!
interface FastEthernet0/1
 description Link-ke-Seelmann-A10
 ip address 10.64.10.74 255.255.255.252
 no shutdown
!
interface FastEthernet0/0
 description LAN-Switch5-A11
 ip address 10.64.12.1 255.255.252.0
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.12.1
ip dhcp pool LAN-A11
 network 10.64.12.0 255.255.252.0
 default-router 10.64.12.1
 dns-server 8.8.8.8
!
router ospf 1
 router-id 6.6.6.6
 passive-interface FastEthernet0/0
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory
