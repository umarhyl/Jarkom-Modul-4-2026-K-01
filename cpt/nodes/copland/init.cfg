enable
configure terminal
hostname Copland
no ip domain-lookup
!
interface FastEthernet0/0
 description Segmen-Switch2-A3
 ip address 10.64.0.139 255.255.255.248
 no shutdown
!
interface FastEthernet0/1
 description LAN-Switch4-A7
 ip address 10.64.8.1 255.255.254.0
 no shutdown
!
interface FastEthernet1/0
 description LAN-Juri-A8
 ip address 10.64.10.1 255.255.255.192
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.8.1
ip dhcp excluded-address 10.64.10.1
ip dhcp pool LAN-A7
 network 10.64.8.0 255.255.254.0
 default-router 10.64.8.1
 dns-server 8.8.8.8
ip dhcp pool LAN-A8
 network 10.64.10.0 255.255.255.192
 default-router 10.64.10.1
 dns-server 8.8.8.8
!
router ospf 1
 router-id 4.4.4.4
 passive-interface FastEthernet0/1
 passive-interface FastEthernet1/0
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory