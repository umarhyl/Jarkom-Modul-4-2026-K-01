enable
configure terminal
hostname Schumann
no ip domain-lookup
!
interface FastEthernet0/0
 description Segmen-Switch2-A3
 ip address 10.64.0.140 255.255.255.248
 no shutdown
!
interface FastEthernet0/1
 description LAN-Akashic-A9
 ip address 10.64.10.65 255.255.255.248
 no shutdown
!
interface FastEthernet1/0
 description Link-ke-Accela-A10
 ip address 10.64.10.73 255.255.255.252
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.10.65
ip dhcp pool LAN-A9
 network 10.64.10.64 255.255.255.248
 default-router 10.64.10.65
 dns-server 8.8.8.8
!
router ospf 1
 router-id 5.5.5.5
 passive-interface FastEthernet0/1
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory