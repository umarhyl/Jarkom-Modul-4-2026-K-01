enable
configure terminal
hostname Tachibana
no ip domain-lookup
!
interface FastEthernet1/0
 description Link-ke-Wired-A5
 ip address 10.64.0.150 255.255.255.252
 no shutdown
!
interface FastEthernet0/0
 description LAN-Switch9-A15
 ip address 10.64.20.1 255.255.254.0
 no shutdown
!
interface FastEthernet0/1
 description Link-ke-Deus-A16
 ip address 10.64.22.1 255.255.255.252
 no shutdown
!
! ---- DHCP server LAN ----
ip dhcp excluded-address 10.64.20.1
ip dhcp pool LAN-A15
 network 10.64.20.0 255.255.254.0
 default-router 10.64.20.1
 dns-server 8.8.8.8
!
router ospf 1
 router-id 8.8.8.8
 passive-interface FastEthernet0/0
 network 10.64.0.0 0.0.255.255 area 0
!
end
write memory